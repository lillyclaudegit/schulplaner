<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mein Schuljahr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk-bg: #1f2c24;
    --chalk-bg-2: #263628;
    --chalk-bg-3: #2c3d2f;
    --chalk-white: #f4f1e6;
    --chalk-white-dim: rgba(244,241,230,0.55);
    --chalk-line: rgba(244,241,230,0.14);
    --chalk-yellow: #e8c468;
    --chalk-pink: #e8919f;
    --chalk-blue: #86b8d9;
    --chalk-red: #dd7e6f;
    --chalk-green: #8fbf8a;
    --paper: #f4f1e6;
    --ink: #22301f;
    --radius: 10px;
    --font-hand: 'Permanent Marker', cursive;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(ellipse at 90% 110%, rgba(255,255,255,0.04), transparent 45%),
      var(--chalk-bg);
    color: var(--chalk-white);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding: 20px 16px 64px;
  }

  .wrap{ max-width: 900px; margin: 0 auto; }

  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 6px;
    border-bottom: 2px dashed var(--chalk-line);
  }
  header.top h1{
    font-family: var(--font-hand);
    font-weight: 400;
    font-size: clamp(28px, 6vw, 40px);
    margin: 0;
    letter-spacing: 0.5px;
    transform: rotate(-1deg);
    color: var(--chalk-white);
  }
  header.top .today{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--chalk-white-dim);
    text-transform: capitalize;
    text-align: right;
    white-space: nowrap;
  }

  /* Tabs styled as binder dividers */
  nav.tabs{
    display:flex;
    gap: 6px;
    margin: 18px 0 22px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  nav.tabs button{
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13.5px;
    color: var(--chalk-white-dim);
    background: var(--chalk-bg-2);
    border: none;
    padding: 10px 16px 9px;
    cursor: pointer;
    white-space: nowrap;
    clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  nav.tabs button:hover{ color: var(--chalk-white); }
  nav.tabs button.active{
    background: var(--chalk-bg-3);
    color: var(--chalk-white);
    transform: translateY(-2px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
  }

  section.view{ display:none; }
  section.view.active{ display:block; animation: fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform: translateY(3px);} to{opacity:1; transform:none;} }

  h2.section-title{
    font-family: var(--font-hand);
    font-weight: 400;
    font-size: 22px;
    margin: 0 0 14px;
    transform: rotate(-0.6deg);
  }
  h3.sub-title{
    font-family: var(--font-body);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--chalk-white-dim);
    margin: 22px 0 10px;
  }

  .card{
    background: var(--chalk-bg-2);
    border: 1px solid var(--chalk-line);
    border-radius: var(--radius);
    padding: 14px 16px;
  }

  /* Countdown chalk badge */
  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width: 58px;
    height: 58px;
    padding: 0 6px;
    border-radius: 50%;
    border: 2px dashed currentColor;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    text-align:center;
    line-height: 1.15;
    flex-shrink: 0;
    transform: rotate(-3deg);
  }
  .badge.ok{ color: var(--chalk-blue); }
  .badge.soon{ color: var(--chalk-yellow); }
  .badge.now{ color: var(--chalk-green); }
  .badge.late{ color: var(--chalk-red); }

  .tag{
    display:inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    color: var(--chalk-bg);
    white-space: nowrap;
  }

  .row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--chalk-line);
  }
  .row:last-child{ border-bottom:none; }
  .row .main{ flex:1; min-width:0; }
  .row .main .txt{ font-size: 14.5px; font-weight: 500; }
  .row .main .txt.done{ text-decoration: line-through; color: var(--chalk-white-dim); }
  .row .meta{ font-size: 12px; color: var(--chalk-white-dim); margin-top: 3px; }

  input[type=checkbox]{
    width: 19px; height: 19px; accent-color: var(--chalk-yellow); cursor:pointer; flex-shrink:0;
  }

  button.icon-btn{
    background:none; border:none; color: var(--chalk-white-dim);
    cursor:pointer; font-size: 16px; padding: 4px 6px; line-height:1;
    transition: color .15s;
  }
  button.icon-btn:hover{ color: var(--chalk-red); }

  .empty{
    color: var(--chalk-white-dim);
    font-size: 13.5px;
    font-style: italic;
    padding: 14px 0;
  }

  /* Forms */
  .form-inline{
    display:flex; flex-wrap:wrap; gap: 8px; margin-top: 10px; align-items:center;
  }
  input[type=text], input[type=date], input[type=number], select{
    font-family: var(--font-body);
    background: var(--chalk-bg);
    border: 1px solid var(--chalk-line);
    color: var(--chalk-white);
    border-radius: 7px;
    padding: 9px 10px;
    font-size: 13.5px;
    outline: none;
  }
  input[type=text]{ flex:1; min-width: 140px; }
  input:focus, select:focus{ border-color: var(--chalk-yellow); }
  ::placeholder{ color: var(--chalk-white-dim); }

  button.primary{
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13.5px;
    background: var(--chalk-yellow);
    color: var(--ink);
    border: none;
    border-radius: 7px;
    padding: 9px 14px;
    cursor: pointer;
    transition: transform .1s;
  }
  button.primary:hover{ transform: translateY(-1px); }
  button.ghost{
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 12.5px;
    background: none;
    border: 1px solid var(--chalk-line);
    color: var(--chalk-white-dim);
    border-radius: 7px;
    padding: 7px 10px;
    cursor: pointer;
  }
  button.ghost:hover{ color: var(--chalk-white); border-color: var(--chalk-white-dim); }

  /* Stundenplan grid */
  .plan-table{ width:100%; border-collapse: collapse; font-size: 12.5px; }
  .plan-table th{
    font-family: var(--font-body); font-weight:600; font-size:11.5px;
    text-transform: uppercase; letter-spacing:.04em;
    color: var(--chalk-white-dim); padding: 6px 4px; text-align:center;
  }
  .plan-table td{ padding: 4px; text-align:center; vertical-align: middle; }
  .plan-table td.period-label{
    font-family: var(--font-mono); color: var(--chalk-white-dim); font-size:11px; white-space:nowrap;
  }
  .plan-cell select{
    width: 100%; padding: 8px 4px; font-size: 12px; text-align:center; border-radius:6px;
  }
  .subject-swatch{
    display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:middle;
  }

  .subject-chip{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--chalk-bg); border:1px solid var(--chalk-line);
    border-radius: 999px; padding: 5px 10px 5px 6px; font-size: 12.5px; margin: 3px 6px 3px 0;
  }
  .color-dot{ width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .color-picker{ display:flex; gap:6px; flex-wrap:wrap; }
  .color-swatch{
    width: 22px; height:22px; border-radius:50%; cursor:pointer; border: 2px solid transparent;
  }
  .color-swatch.selected{ border-color: var(--chalk-white); }

  /* Grades */
  .subject-block{ margin-bottom: 18px; }
  .subject-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;
  }
  .avg-pill{
    font-family: var(--font-mono); font-weight:700; font-size: 15px;
    padding: 4px 10px; border-radius: 8px; border: 1px dashed currentColor;
  }
  .avg-pill.gut{ color: var(--chalk-green); }
  .avg-pill.mittel{ color: var(--chalk-yellow); }
  .avg-pill.schlecht{ color: var(--chalk-red); }

  .overall-avg{
    text-align:center; padding: 18px; margin-bottom: 22px;
  }
  .overall-avg .num{
    font-family: var(--font-hand); font-size: 46px; display:block; transform: rotate(-2deg);
  }
  .overall-avg .lbl{ font-size: 12px; color: var(--chalk-white-dim); text-transform:uppercase; letter-spacing:.08em; }

  .grid-2{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px){ .grid-2{ grid-template-columns: 1fr; } }

  footer.reset{
    text-align:center; margin-top: 40px; opacity: 0.5; font-size: 12px;
  }
  footer.reset button{ background:none;border:none;color:var(--chalk-white-dim);text-decoration:underline;cursor:pointer;font-size:12px; }

  .loading{ text-align:center; padding: 60px 0; color: var(--chalk-white-dim); font-family: var(--font-mono); font-size:13px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">lade deinen Schulplaner …</div>
</div>

<script>
const STORAGE_KEY = 'schulplaner-data';
const SWATCHES = ['#dd7e6f','#e8c468','#8fbf8a','#86b8d9','#c39bd3','#e8919f','#7fd1c3','#e6a866'];
const WEEKDAYS = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];

let state = null;

function uid(){ return Math.random().toString(36).slice(2,9); }
function todayISO(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function daysUntil(dateStr){
  const target = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((target-now)/86400000);
}
function fmtDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
}
function badgeFor(dateStr){
  const n = daysUntil(dateStr);
  let cls='ok', label='';
  if(n<0){ cls='late'; label = 'überf.\n'+Math.abs(n)+'T'; }
  else if(n===0){ cls='now'; label='heute'; }
  else if(n===1){ cls='soon'; label='morgen'; }
  else if(n<=3){ cls='soon'; label='in\n'+n+' Tg.'; }
  else { cls='ok'; label='in\n'+n+' Tg.'; }
  return {cls,label};
}
function subjectById(id){ return state.subjects.find(s=>s.id===id); }
function subjectName(id){ const s=subjectById(id); return s? s.name : '(gelöscht)'; }
function subjectColor(id){ const s=subjectById(id); return s? s.color : '#888'; }

function defaultState(){
  return {
    subjects: [],
    schedule: { periods: 6, cells: {} }, // cells key "day-period" -> subjectId
    homework: [],
    tests: [],
    grades: [],
    todos: []
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
  }catch(e){
    state = defaultState();
  }
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Speichern fehlgeschlagen', e);
  }
}
async function persistAndRender(){ saveState(); render(); }

let activeTab = 'heute';

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function tagHTML(subjectId){
  if(!subjectId) return '';
  return `<span class="tag" style="background:${subjectColor(subjectId)}">${subjectName(subjectId)}</span>`;
}

/* ---------- HEUTE ---------- */
function renderHeute(){
  const jsDay = new Date().getDay(); // 0=So
  const dayIndex = jsDay===0?6:jsDay-1; // 0=Mo
  const todayName = WEEKDAYS[dayIndex] || null;

  let lessonsHTML = '<div class="empty">Kein Schultag heute oder noch kein Stundenplan angelegt.</div>';
  if(todayName){
    const entries = [];
    for(let p=1; p<=state.schedule.periods; p++){
      const sid = state.schedule.cells[dayIndex+'-'+p];
      if(sid) entries.push({p, sid});
    }
    if(entries.length){
      lessonsHTML = entries.map(e=>`
        <div class="row">
          <div class="main">
            <span class="subject-swatch" style="background:${subjectColor(e.sid)}"></span>
            <span class="txt">Std. ${e.p} — ${subjectName(e.sid)}</span>
          </div>
        </div>`).join('');
    }
  }

  const upcoming = [];
  state.homework.filter(h=>!h.done).forEach(h=>upcoming.push({...h, type:'Hausaufgabe'}));
  state.tests.forEach(t=>upcoming.push({...t, type:'Test/Arbeit'}));
  upcoming.sort((a,b)=> daysUntil(a.date||a.due) - daysUntil(b.date||b.due));
  const soonItems = upcoming.filter(i => daysUntil(i.date||i.due) <= 5).slice(0,6);

  let soonHTML = '<div class="empty">Nichts Dringendes anstehend — gut so!</div>';
  if(soonItems.length){
    soonHTML = soonItems.map(i=>{
      const d = i.date||i.due;
      const b = badgeFor(d);
      return `<div class="row">
        <div class="badge ${b.cls}">${b.label}</div>
        <div class="main">
          <div class="txt">${i.text}</div>
          <div class="meta">${i.type} · ${tagHTML(i.subjectId)}</div>
        </div>
      </div>`;
    }).join('');
  }

  const todosHTML = state.todos.length ? state.todos.map(t=>`
    <div class="row">
      <input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo('${t.id}')">
      <div class="main"><span class="txt ${t.done?'done':''}">${t.text}</span></div>
      <button class="icon-btn" onclick="deleteTodo('${t.id}')">✕</button>
    </div>`).join('') : '<div class="empty">Noch keine Aufgaben für heute eingetragen.</div>';

  return `
    <h2 class="section-title">Heute im Blick</h2>
    <div class="grid-2">
      <div class="card">
        <h3 class="sub-title">Stundenplan${todayName?' — '+todayName:''}</h3>
        ${lessonsHTML}
      </div>
      <div class="card">
        <h3 class="sub-title">Bald fällig</h3>
        ${soonHTML}
      </div>
    </div>
    <h3 class="sub-title">To-do für heute</h3>
    <div class="card">
      ${todosHTML}
      <div class="form-inline">
        <input type="text" id="todo-input" placeholder="Neue Aufgabe hinzufügen …" onkeydown="if(event.key==='Enter')addTodo()">
        <button class="primary" onclick="addTodo()">Hinzufügen</button>
      </div>
    </div>
  `;
}
async function addTodo(){
  const input = document.getElementById('todo-input');
  const text = input.value.trim();
  if(!text) return;
  state.todos.push({id:uid(), text, done:false});
  input.value='';
  await persistAndRender();
}
async function toggleTodo(id){
  const t = state.todos.find(t=>t.id===id); if(t) t.done=!t.done;
  await persistAndRender();
}
async function deleteTodo(id){
  state.todos = state.todos.filter(t=>t.id!==id);
  await persistAndRender();
}

/* ---------- FÄCHER (shared subject manager) ---------- */
function subjectManagerHTML(){
  const chips = state.subjects.map(s=>`
    <span class="subject-chip">
      <span class="color-dot" style="background:${s.color}"></span>${s.name}
      <button class="icon-btn" style="font-size:13px" onclick="deleteSubject('${s.id}')">✕</button>
    </span>`).join('');
  return `
    <h3 class="sub-title">Fächer verwalten</h3>
    <div class="card">
      <div>${chips || '<span class="empty">Noch keine Fächer angelegt.</span>'}</div>
      <div class="form-inline">
        <input type="text" id="subject-input" placeholder="Fachname, z. B. Mathematik" style="flex:1">
      </div>
      <div class="color-picker" id="color-picker" style="margin-top:8px;">
        ${SWATCHES.map((c,i)=>`<span class="color-swatch ${i===0?'selected':''}" style="background:${c}" data-color="${c}" onclick="selectColor('${c}', this)"></span>`).join('')}
      </div>
      <div class="form-inline">
        <button class="primary" onclick="addSubject()">Fach hinzufügen</button>
      </div>
    </div>
  `;
}
let pickedColor = SWATCHES[0];
function selectColor(c, elm){
  pickedColor = c;
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
  elm.classList.add('selected');
}
async function addSubject(){
  const input = document.getElementById('subject-input');
  const name = input.value.trim();
  if(!name) return;
  state.subjects.push({id:uid(), name, color: pickedColor});
  pickedColor = SWATCHES[0];
  await persistAndRender();
}
async function deleteSubject(id){
  if(!confirm('Fach wirklich löschen? Zugehörige Einträge bleiben, verlieren aber die Fachzuordnung.')) return;
  state.subjects = state.subjects.filter(s=>s.id!==id);
  await persistAndRender();
}

/* ---------- STUNDENPLAN ---------- */
function renderStundenplan(){
  const subjOptions = `<option value="">—</option>` + state.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  let rows = '';
  for(let p=1; p<=state.schedule.periods; p++){
    let cells = '';
    for(let d=0; d<5; d++){
      const key = d+'-'+p;
      const val = state.schedule.cells[key] || '';
      const bg = val ? subjectColor(val) : 'transparent';
      cells += `<td class="plan-cell">
        <select style="background:${val?bg:'var(--chalk-bg)'}; color:${val?'#1b241a':'var(--chalk-white)'}; font-weight:${val?700:400}"
          onchange="setCell(${d},${p},this.value)">
          ${subjOptions.replace(`value="${val}"`, `value="${val}" selected`)}
        </select>
      </td>`;
    }
    rows += `<tr><td class="period-label">Std. ${p}</td>${cells}</tr>`;
  }
  return `
    <h2 class="section-title">Stundenplan</h2>
    ${subjectManagerHTML()}
    <h3 class="sub-title">Wochenplan</h3>
    <div class="card" style="overflow-x:auto">
      <table class="plan-table">
        <thead><tr><th></th>${WEEKDAYS.map(d=>`<th>${d.slice(0,2)}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="form-inline" style="margin-top:10px">
        <button class="ghost" onclick="addPeriod()">+ Stunde hinzufügen</button>
        ${state.schedule.periods>1 ? '<button class="ghost" onclick="removePeriod()">− letzte Stunde entfernen</button>' : ''}
      </div>
    </div>
  `;
}
async function setCell(day, period, subjectId){
  const key = day+'-'+period;
  if(subjectId) state.schedule.cells[key] = subjectId;
  else delete state.schedule.cells[key];
  await saveState();
}
async function addPeriod(){ state.schedule.periods++; await persistAndRender(); }
async function removePeriod(){
  const p = state.schedule.periods;
  for(let d=0; d<5; d++) delete state.schedule.cells[d+'-'+p];
  state.schedule.periods--; await persistAndRender();
}

/* ---------- AUFGABEN (Hausaufgaben) ---------- */
function renderAufgaben(){
  const subjOptions = `<option value="">Fach wählen</option>` + state.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const sorted = [...state.homework].sort((a,b)=> new Date(a.due)-new Date(b.due));
  const openList = sorted.filter(h=>!h.done);
  const doneList = sorted.filter(h=>h.done);

  function rowHTML(h){
    const b = badgeFor(h.due);
    return `<div class="row">
      <input type="checkbox" ${h.done?'checked':''} onchange="toggleHomework('${h.id}')">
      <div class="badge ${h.done?'ok':b.cls}" style="${h.done?'opacity:.4':''}">${h.done?fmtDate(h.due):b.label}</div>
      <div class="main">
        <div class="txt ${h.done?'done':''}">${h.text}</div>
        <div class="meta">${tagHTML(h.subjectId)} · fällig ${fmtDate(h.due)}</div>
      </div>
      <button class="icon-btn" onclick="deleteHomework('${h.id}')">✕</button>
    </div>`;
  }

  return `
    <h2 class="section-title">Hausaufgaben</h2>
    <div class="card">
      <h3 class="sub-title" style="margin-top:0">Offen</h3>
      ${openList.length? openList.map(rowHTML).join('') : '<div class="empty">Keine offenen Hausaufgaben. 🎉</div>'}
      ${doneList.length? `<h3 class="sub-title">Erledigt</h3>${doneList.map(rowHTML).join('')}` : ''}
      <div class="form-inline">
        <select id="hw-subject">${subjOptions}</select>
        <input type="text" id="hw-text" placeholder="z. B. Seite 42, Aufgabe 3–5">
        <input type="date" id="hw-due" value="${todayISO()}">
        <button class="primary" onclick="addHomework()">Hinzufügen</button>
      </div>
    </div>
  `;
}
async function addHomework(){
  const subjectId = document.getElementById('hw-subject').value;
  const text = document.getElementById('hw-text').value.trim();
  const due = document.getElementById('hw-due').value;
  if(!text || !due) return;
  state.homework.push({id:uid(), subjectId, text, due, done:false});
  await persistAndRender();
}
async function toggleHomework(id){
  const h = state.homework.find(h=>h.id===id); if(h) h.done=!h.done;
  await persistAndRender();
}
async function deleteHomework(id){
  state.homework = state.homework.filter(h=>h.id!==id);
  await persistAndRender();
}

/* ---------- TESTS & ARBEITEN ---------- */
function renderTests(){
  const subjOptions = `<option value="">Fach wählen</option>` + state.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const sorted = [...state.tests].sort((a,b)=> new Date(a.date)-new Date(b.date));

  function rowHTML(t){
    const b = badgeFor(t.date);
    return `<div class="row">
      <div class="badge ${b.cls}">${b.label}</div>
      <div class="main">
        <div class="txt">${t.text}</div>
        <div class="meta">${tagHTML(t.subjectId)} · am ${fmtDate(t.date)}</div>
      </div>
      <button class="icon-btn" onclick="deleteTest('${t.id}')">✕</button>
    </div>`;
  }

  return `
    <h2 class="section-title">Tests &amp; Arbeiten</h2>
    <div class="card">
      ${sorted.length? sorted.map(rowHTML).join('') : '<div class="empty">Keine Tests oder Arbeiten eingetragen.</div>'}
      <div class="form-inline">
        <select id="test-subject">${subjOptions}</select>
        <input type="text" id="test-text" placeholder="z. B. Vokabeltest Kapitel 4">
        <input type="date" id="test-date" value="${todayISO()}">
        <button class="primary" onclick="addTest()">Hinzufügen</button>
      </div>
    </div>
  `;
}
async function addTest(){
  const subjectId = document.getElementById('test-subject').value;
  const text = document.getElementById('test-text').value.trim();
  const date = document.getElementById('test-date').value;
  if(!text || !date) return;
  state.tests.push({id:uid(), subjectId, text, date});
  await persistAndRender();
}
async function deleteTest(id){
  state.tests = state.tests.filter(t=>t.id!==id);
  await persistAndRender();
}

/* ---------- NOTEN ---------- */
function computeAvg(gradesArr){
  if(!gradesArr.length) return null;
  let sumW=0, sumV=0;
  gradesArr.forEach(g=>{ sumW += g.weight; sumV += g.value*g.weight; });
  return sumV/sumW;
}
function avgClass(v){
  if(v===null) return '';
  if(v<=2.3) return 'gut';
  if(v<=4.0) return 'mittel';
  return 'schlecht';
}
function renderNoten(){
  const subjOptions = `<option value="">Fach wählen</option>` + state.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');

  const allVals = [];
  const blocks = state.subjects.map(s=>{
    const grades = state.grades.filter(g=>g.subjectId===s.id);
    const avg = computeAvg(grades);
    if(avg!==null) allVals.push(avg);
    const rows = grades.map(g=>`
      <div class="row">
        <div class="main">
          <span class="txt">Note ${g.value}${g.label? ' — '+g.label:''}</span>
          <div class="meta">Gewichtung ×${g.weight}</div>
        </div>
        <button class="icon-btn" onclick="deleteGrade('${g.id}')">✕</button>
      </div>`).join('');
    return `
      <div class="subject-block">
        <div class="subject-header">
          <span><span class="subject-swatch" style="background:${s.color}"></span><strong>${s.name}</strong></span>
          ${avg!==null? `<span class="avg-pill ${avgClass(avg)}">Ø ${avg.toFixed(2)}</span>` : `<span class="meta">noch keine Note</span>`}
        </div>
        <div class="card">${rows || '<div class="empty">Noch keine Noten in diesem Fach.</div>'}</div>
      </div>`;
  }).join('');

  const overall = allVals.length ? (allVals.reduce((a,b)=>a+b,0)/allVals.length) : null;

  return `
    <h2 class="section-title">Notenspiegel</h2>
    ${overall!==null ? `
      <div class="card overall-avg">
        <span class="num">${overall.toFixed(2)}</span>
        <span class="lbl">Gesamtdurchschnitt über alle Fächer</span>
      </div>` : ''}
    ${state.subjects.length ? blocks : '<div class="empty">Lege zuerst Fächer im Reiter „Stundenplan" an.</div>'}
    <h3 class="sub-title">Neue Note eintragen</h3>
    <div class="card">
      <div class="form-inline">
        <select id="grade-subject">${subjOptions}</select>
        <select id="grade-value">
          ${[1,2,3,4,5,6].map(n=>`<option value="${n}">Note ${n}</option>`).join('')}
        </select>
        <input type="number" id="grade-weight" value="1" min="0.5" max="5" step="0.5" style="width:80px" title="Gewichtung">
        <input type="text" id="grade-label" placeholder="Bezeichnung (optional), z. B. Klassenarbeit">
        <button class="primary" onclick="addGrade()">Note speichern</button>
      </div>
    </div>
  `;
}
async function addGrade(){
  const subjectId = document.getElementById('grade-subject').value;
  const value = Number(document.getElementById('grade-value').value);
  const weight = Number(document.getElementById('grade-weight').value) || 1;
  const label = document.getElementById('grade-label').value.trim();
  if(!subjectId) { alert('Bitte zuerst ein Fach wählen.'); return; }
  state.grades.push({id:uid(), subjectId, value, weight, label});
  await persistAndRender();
}
async function deleteGrade(id){
  state.grades = state.grades.filter(g=>g.id!==id);
  await persistAndRender();
}

/* ---------- SHELL / NAV ---------- */
const TABS = [
  {id:'heute', label:'Heute', render: renderHeute},
  {id:'plan', label:'Stundenplan', render: renderStundenplan},
  {id:'hausaufgaben', label:'Hausaufgaben', render: renderAufgaben},
  {id:'tests', label:'Tests & Arbeiten', render: renderTests},
  {id:'noten', label:'Noten', render: renderNoten},
];

async function setTab(id){
  activeTab = id;
  render();
}

function render(){
  const app = document.getElementById('app');
  const dateStr = new Date().toLocaleDateString('de-DE',{weekday:'long', day:'2-digit', month:'long'});
  const navHTML = TABS.map(t=>`<button class="${t.id===activeTab?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('');
  const current = TABS.find(t=>t.id===activeTab);

  app.innerHTML = `
    <header class="top">
      <h1>Mein Schuljahr</h1>
      <div class="today">${dateStr}</div>
    </header>
    <nav class="tabs">${navHTML}</nav>
    <section class="view active">${current.render()}</section>
    <footer class="reset">
      <button onclick="resetAll()">Alle Daten zurücksetzen</button>
    </footer>
  `;
}

async function resetAll(){
  if(!confirm('Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden.')) return;
  state = defaultState();
  await persistAndRender();
}

(function init(){
  loadState();
  render();
})();
</script>
</body>
</html>
